<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derek Meyers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #1a2332;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: #1a2332;
            color: white;
            padding: 60px 40px 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 35px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #1a2332;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .section-content {
            font-size: 1.05em;
            color: #555;
            line-height: 1.7;
        }

        .highlight {
            color: #1a2332;
            font-weight: 600;
        }

        .emoji {
            font-size: 1.2em;
            margin-right: 8px;
        }

        .emoji {
            font-size: 1.2em;
            margin-right: 8px;
        }

        @media (max-width: 600px) {
            .header {
                padding: 40px 30px 30px;
            }

            .header h1 {
                font-size: 2em;
            }

            .content {
                padding: 30px;
            }

            .section {
                margin-bottom: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Derek Meyers</h1>
            <p>Yorktown, VA • University of Virginia School of Medicine</p>
        </div>
        
        <div class="content">
            <div class="section">
                <div class="section-title">The Moment That Shaped Me</div>
                <div class="section-content">
                    Sleeping through a surgical consult while on call.
                </div>
            </div>

            <div class="section">
                <div class="section-title">Where I'm Headed</div>
                <div class="section-content">
                    <span class="highlight">Internal Medicine</span> — Intolerance of sleep deprivation.
                </div>
            </div>

            <div class="section">
                <div class="section-title">What Matters Beyond Medicine</div>
                <div class="section-content">
                    Always seeing the humor in life.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
